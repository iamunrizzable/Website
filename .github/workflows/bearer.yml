# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Bearer.com to manage findings, notifications and more.
# See https://docs.bearer.com/guides/bearer-cloud/
name: Bearer

on:
  push:
    branches: ["main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: '28 20 * * 6'

permissions:
  contents: read # for actions/checkout to fetch code
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
  actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Scan code using Bearer CLI. Retried up to 3x as separate steps (not
      # a wrapper action like nick-fields/retry — those only retry shell
      # `run:` commands, not a `uses:` step) because bearer-action's own
      # install step is a bare `curl -sL ... | sh` with no retry logic of
      # its own and no error output unless debug logging is on: confirmed
      # via two live failures (356c235, 2026-09-21) that the release
      # tarball/checksums were valid and independently downloadable the
      # whole time — the flakiness is a transient fetch against GitHub's
      # release CDN from the Actions runner, not a problem with the
      # release or this repo. See run 35617323730 for the original
      # failures this was added for.
      - name: Run Report (attempt 1)
        id: report
        continue-on-error: true
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: results.sarif
          exit-code: 0
      - name: Wait before retry
        if: steps.report.outcome == 'failure'
        run: sleep 15
      - name: Run Report (attempt 2)
        id: report2
        if: steps.report.outcome == 'failure'
        continue-on-error: true
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: results.sarif
          exit-code: 0
      - name: Wait before retry
        if: steps.report.outcome == 'failure' && steps.report2.outcome == 'failure'
        run: sleep 30
      - name: Run Report (attempt 3)
        id: report3
        if: steps.report.outcome == 'failure' && steps.report2.outcome == 'failure'
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: results.sarif
          exit-code: 0
      # Upload SARIF file generated by whichever attempt above succeeded.
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
