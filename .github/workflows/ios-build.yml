name: iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build for device (no signing)
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Hallie.xcodeproj -scheme Hallie \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -40
          exit $status
